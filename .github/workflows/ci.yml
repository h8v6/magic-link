name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magic_link_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,sqlalchemy,redis,smtp,cli]

      - name: Wait for services
        env:
          MAGIC_LINK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/magic_link_test
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          dsn = os.environ["MAGIC_LINK_TEST_DATABASE_URL"]
          for attempt in range(20):
              try:
                  with psycopg.connect(dsn, connect_timeout=3):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("PostgreSQL service did not become ready in time")
          PY

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

      - name: Type check with MyPy
        run: mypy magic_link

      - name: Run tests
        env:
          MAGIC_LINK_SECRET_KEY: ci-secret
          MAGIC_LINK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/magic_link_test
          MAGIC_LINK_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest
